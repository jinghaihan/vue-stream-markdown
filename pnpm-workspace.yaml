blockExoticSubdeps: false
minimumReleaseAge: 0

packages:
  - benchmark
  - packages/*
  - packages/extensions/*
  - packages/markmend/*
  - playground/*
  - docs

overrides:
  comark-content: 0.3.0
  typescript: catalog:dev
  vue: catalog:frontend

patchedDependencies:
  comark-docs@0.0.1: patches/comark-docs@0.0.1.patch
  comark@0.6.2: patches/comark@0.6.2.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - '@parcel/watcher'
  - unrs-resolver

